<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="N5 Studio integra narrativa, producción audiovisual, tecnología e innovación para transformar ideas en experiencias." />
    <title>N5 Studio — Ideas que trascienden</title>
    <style>
      body { margin: 0; background: #000000; }
      .initial-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        color: #ffffff;
      }
      .initial-preloader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      .initial-preloader-logo {
        width: 88px;
        height: auto;
        animation: initialLogoPulse 2s ease-in-out infinite;
      }
      .initial-preloader-bar {
        width: 130px;
        height: 2px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 1px;
        overflow: hidden;
        position: relative;
      }
      .initial-preloader-progress {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, transparent, #670d8c, #a43cd2);
        border-radius: 1px;
        animation: initialLineShimmer 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes initialLogoPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(103, 13, 140, 0)); opacity: 0.88; }
        50% { transform: scale(1.04); filter: drop-shadow(0 0 18px rgba(103, 13, 140, 0.65)); opacity: 1; }
      }
      @keyframes initialLineShimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-preloader" aria-label="Cargando N5 Studio">
        <div class="initial-preloader-content">

</html>
